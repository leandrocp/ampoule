name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Lint, unit tests and the build run side by side; the smoke test and the examples only wait for
# the build. The Rust caches are saved from main only: each is over a gigabyte, and copies saved by
# pull requests push main's out of the repository's 10 GB.
jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  lint:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: build/engine

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: runner
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        working-directory: runner
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features --target-dir target/lean -- -D warnings

  unit:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: build/engine

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.0"
          targets: wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: runner
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "28.5.0.9"
          elixir-version: "1.20.5"

      - name: Unit tests
        working-directory: runner
        run: cargo test

  # ampoule and the lean runtime (no Cranelift), with the `ci` profile: `release` without its LTO.
  # The lean runtime goes next to ampoule, as in a release, so the smoke test and every example
  # pack on it.
  build:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: build/engine

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: runner
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: runner
        run: |
          cargo build --profile ci
          cargo build --profile ci --no-default-features --target-dir target/lean
          target=$(target/ci/ampoule version | sed -E 's/.*\(([a-z0-9_]+-[a-z]+),.*/\1/')
          cp target/lean/ci/ampoule "target/ci/ampoule-$target"

      - uses: actions/upload-artifact@v7
        with:
          name: ampoule-${{ matrix.os }}
          path: runner/target/ci/ampoule*
          if-no-files-found: error

  # test/fixture packed and checked, against the binary the build job made.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: build/engine

      - uses: actions/download-artifact@v8
        with:
          name: ampoule-${{ matrix.os }}
          path: runner/target/release

      - name: Make the binaries executable
        run: chmod +x runner/target/release/ampoule*

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "28.5.0.9"
          elixir-version: "1.20.5"

      - name: Fetch wasi-sdk (to build NIFs at pack time)
        run: elixir scripts/engine.exs sdk

      - name: Smoke test
        run: elixir scripts/smoke.exs --network

  # Each example's end-to-end suite (examples/*/test/e2e) against the binary the build job made:
  # pack the example, run the binary, test it from outside. The quick ones share a job: macOS
  # runners are few, and each job spends most of a minute setting up.
  examples:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        examples: ["cluster francis ports", "c_nif sqlite", rustler]
        rustler: [locked]
        include:
          # Needs Postgres, and macOS runners cannot run service containers.
          - os: ubuntu-24.04
            examples: phoenix_ecto
            rustler: locked
          - os: ubuntu-24.04
            examples: rustler
            rustler: "0.38.0"
          - os: macos-15
            examples: rustler
            rustler: "0.38.0"
    name: examples (${{ matrix.examples }}${{ matrix.rustler != 'locked' && format(' {0}', matrix.rustler) || '' }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.examples == 'phoenix_ecto' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: engine
          path: build/engine

      - uses: actions/download-artifact@v8
        with:
          name: ampoule-${{ matrix.os }}
          path: runner/target/release

      - name: Make the binaries executable
        run: chmod +x runner/target/release/ampoule*

      - uses: dtolnay/rust-toolchain@v1
        if: matrix.examples == 'rustler'
        with:
          toolchain: "1.99.0"
          targets: wasm32-wasip1-threads

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "28.5.0.9"
          elixir-version: "1.20.5"

      - name: Fetch wasi-sdk (to build NIFs at pack time)
        run: elixir scripts/engine.exs sdk

      - name: Use Rustler ${{ matrix.rustler }}
        if: matrix.rustler != 'locked'
        run: cargo update --manifest-path examples/rustler/native/textkit/Cargo.toml -p rustler --precise ${{ matrix.rustler }}

      - name: End-to-end suite
        run: elixir scripts/examples.exs ${{ matrix.examples }}
